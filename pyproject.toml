[project]
name = "home-assistant-neosmartblinds"
version = "0.0.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.13.2,<4.0"
dependencies = [
    "homeassistant (>=2025.7.4)",
]

[dependency-groups]
dev = ["ruff>=0.12.7", "pytest>=8.4.1", "pytest-anyio"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]


[tool.ruff]
src = ["custom_components/neosmartblinds"]
line-length = 100

[tool.ruff.lint]
select =["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
